<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ollama Chat</title>
    <link rel="stylesheet" href="styles.css">
    <script src="dist/react.production.min.js"></script>
    <script src="dist/react-dom.production.min.js"></script>
    <script src="dist/babel.min.js"></script>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useRef, useEffect } = React;

        function ChatApp() {
            const [messages, setMessages] = useState([]);
            const [input, setInput] = useState('');
            const [loading, setLoading] = useState(false);
            const [ollamaStatus, setOllamaStatus] = useState('checking');
            const ollamaUrl = '';
            const [model, setModel] = useState('pip');

            const messagesEndRef = useRef(null);
            const inputRef = useRef(null);

            const STORAGE_KEY = 'robot_chat_history';
            const CONTEXT_LENGTH = 8;

            // Load messages from localStorage on mount
            useEffect(() => {
                try {
                    const stored = localStorage.getItem(STORAGE_KEY);
                    if (stored) {
                        setMessages(JSON.parse(stored));
                    }
                } catch (error) {
                    console.error('Failed to load chat history:', error);
                }
            }, []);

            // Save messages to localStorage whenever they change
            useEffect(() => {
                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(messages));
                } catch (error) {
                    console.error('Failed to save chat history:', error);
                }
            }, [messages]);

            const getOllamaStatusLabel = () => {
                switch (ollamaStatus) {
                    case 'online':
                        return 'Ollama online';
                    case 'offline':
                        return 'Ollama offline';
                    default:
                        return 'Checking Ollama...';
                }
            };

            const fetchOllamaStatus = async () => {
                try {
                    const response = await fetch(`${ollamaUrl}/api/version`, {
                        method: 'GET',
                        cache: 'no-store',
                    });
                    setOllamaStatus(response.ok ? 'online' : 'offline');
                } catch (error) {
                    setOllamaStatus('offline');
                }
            };

            useEffect(() => {
                fetchOllamaStatus();
                const interval = setInterval(fetchOllamaStatus, 8000);
                return () => clearInterval(interval);
            }, []);

            const scrollToBottom = () => {
                messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
            };

            useEffect(() => {
                scrollToBottom();
            }, [messages]);

            useEffect(() => {
                if (!loading) {
                    inputRef.current?.focus();
                }
            }, [loading, messages]);

            const getContextMessages = () => {
                // Get last 8 non-error messages for Ollama context
                const nonErrorMessages = messages.filter(m => m.role !== 'error');
                const recentMessages = nonErrorMessages.slice(-CONTEXT_LENGTH);
                return recentMessages;
            };

            const getSafeAssistantContent = (payload) => {
                const content = typeof payload?.response === 'string' ? payload.response : '';
                const thinking = typeof payload?.thinking === 'string' ? payload.thinking : '';

                if (thinking && content && content === thinking) {
                    return '';
                }

                const contentStripped = content.replace(/^\s+|\s+$/g, '');
                const thinkingStripped = thinking.replace(/^\s+|\s+$/g, '');

                if (
                    (!contentStripped && !thinkingStripped) ||
                    /^(?:<think|<thinking|thinking\s*:)/i.test(contentStripped) ||
                    /^(?:<think|<thinking|thinking\s*:)/i.test(thinkingStripped) ||
                    /<think\b|<thinking\b|thinking\s*:/i.test(contentStripped) ||
                    /<think\b|<thinking\b|thinking\s*:/i.test(thinkingStripped)
                ) {
                    return '';
                }

                return content;
            };

            const appendChunkToText = (existingText, nextChunk) => {
                if (!nextChunk) return existingText;

                const cleanChunk = String(nextChunk).replace(/\r/g, '');
                if (!cleanChunk) return existingText;

                const prev = String(existingText || '');

                if (!prev) return cleanChunk;

                const prevLastChar = prev.slice(-1);
                const nextFirstChar = cleanChunk.charAt(0);
                const needsSpace =
                    prev.length > 0 &&
                    /[A-Za-z0-9]/.test(prevLastChar) &&
                    /[A-Za-z0-9]/.test(nextFirstChar) &&
                    !/\s/.test(cleanChunk.charAt(0));

                return prev + (needsSpace ? ' ' : '') + cleanChunk;
            };

            const splitStreamText = (text) => {
                if (!text) return [];

                const candidates = text.match(/\S+\s*|\s+/g) || [text];
                return candidates.filter(Boolean).map(part => part.trim() ? part.trim() : part);
            };

            const streamAssistantResponse = async (response, onChunk, onComplete) => {
                if (!response.body) {
                    throw new Error('Streaming is not supported by this Ollama response.');
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';
                let finalPayload = null;

                try {
                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;

                        buffer += decoder.decode(value, { stream: true });
                        const parts = buffer.split('\n');
                        buffer = parts.pop() || '';

                        for (const part of parts) {
                            const trimmed = part.trim();
                            if (!trimmed) continue;

                            try {
                                const payload = JSON.parse(trimmed);
                                finalPayload = payload;
                                const chunkContent = getSafeAssistantContent(payload);
                                if (chunkContent) {
                                    const wordChunks = splitStreamText(chunkContent);
                                    for (const wordChunk of wordChunks) {
                                        onChunk(wordChunk);
                                    }
                                }
                            } catch (error) {
                                // Ignore partial/incomplete JSON fragments while streaming.
                            }
                        }
                    }

                    if (buffer.trim()) {
                        try {
                            const payload = JSON.parse(buffer.trim());
                            finalPayload = payload;
                            const chunkContent = getSafeAssistantContent(payload);
                            if (chunkContent) {
                                const wordChunks = splitStreamText(chunkContent);
                                for (const wordChunk of wordChunks) {
                                    onChunk(wordChunk);
                                }
                            }
                        } catch (error) {
                            // Ignore trailing partial JSON fragments.
                        }
                    }

                    onComplete(finalPayload);
                } finally {
                    reader.releaseLock();
                }
            };

            const sendMessage = async (e) => {
                e.preventDefault();
                if (!input.trim()) return;

                const userMessage = input;
                setInput('');
                setMessages(prev => [...prev, { role: 'user', content: userMessage }]);
                setLoading(true);

                try {
                    const contextMessages = getContextMessages();
                    const response = await fetch(`${ollamaUrl}/api/generate`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            model: model,
                            prompt: userMessage,
                            context: contextMessages.map(msg => msg.content).join('\n'),
                            stream: true,
                            raw: true,
                        }),
                    });

                    if (!response.ok) {
                        throw new Error(`Ollama error: ${response.statusText}`);
                    }

                    let streamedContent = '';
                    const assistantIndex = messages.length + 1;

                    setMessages(prev => [...prev, {
                        role: 'assistant',
                        content: '',
                        metrics: null
                    }]);

                    await streamAssistantResponse(
                        response,
                        (chunk) => {
                            streamedContent = appendChunkToText(streamedContent, chunk);
                            setMessages(prev => {
                                const next = [...prev];
                                if (!next[assistantIndex]) {
                                    next[assistantIndex] = { role: 'assistant', content: '', metrics: null };
                                }
                                next[assistantIndex] = {
                                    ...next[assistantIndex],
                                    content: streamedContent,
                                };
                                return next;
                            });
                        },
                        (payload) => {
                            const totalDurationMs = (payload?.total_duration || 0) / 1_000_000;
                            const evalCount = Number(payload?.eval_count || 0);
                            const evalDurationSeconds = (payload?.eval_duration || 0) / 1_000_000_000;
                            const tokensPerSecond = evalDurationSeconds > 0 ? evalCount / evalDurationSeconds : 0;

                            if (!streamedContent.trim()) {
                                throw new Error('The model returned only thinking text.');
                            }

                            setMessages(prev => {
                                const next = [...prev];
                                const message = next[assistantIndex] || { role: 'assistant', content: streamedContent, metrics: null };
                                next[assistantIndex] = {
                                    ...message,
                                    metrics: {
                                        timeMs: totalDurationMs,
                                        tokens: evalCount,
                                        tokensPerSecond: tokensPerSecond,
                                    }
                                };
                                return next;
                            });
                        }
                    );
                } catch (error) {
                    setMessages(prev => [...prev, { 
                        role: 'error', 
                        content: `Error: ${error.message}. Make sure Ollama is running on the web server.`
                    }]);
                } finally {
                    setLoading(false);
                }
            };

            const clearHistory = () => {
                if (window.confirm('Clear chat history?')) {
                    setMessages([]);
                }
            };

            return (
                <main className="container">
                    <header className="header">
                        <h1>
                            {model}...
                            <span className={`status-pill ${ollamaStatus}`}>
                                <span className="status-dot" />
                                {getOllamaStatusLabel()}
                            </span>
                        </h1>
                        <button onClick={clearHistory} className="clear-button">Clear History</button>
                    </header>

                    <div className="chat-container">
                        <div className="messages">
                            {!messages.length && !loading && (
                                <div className="intro">
                                    What’s on the agenda today?
                                </div>
                            )}

                            {messages.map((msg, idx) => (
                                <div key={idx} className={`message ${msg.role}`}>
                                    <div className="message-role">
                                        {msg.role === 'user' ? 'You' : msg.role === 'assistant' ? 'Assistant' : 'Error'}
                                    </div>
                                    <div className="message-content">
                                        {msg.content}
                                        {msg.role === 'assistant' && msg.metrics && (
                                            <div className="message-metrics">
                                                {`Time: ${(msg.metrics.timeMs / 1000).toFixed(2)}s | Tokens: ${msg.metrics.tokens} | ${msg.metrics.tokensPerSecond.toFixed(1)} tok/s`}
                                            </div>
                                        )}
                                    </div>
                                </div>
                            ))}
                            {loading && (
                                <div className="message assistant">
                                    <div className="message-role">🤖 Assistant</div>
                                    <div className="message-content typing">Thinking...</div>
                                </div>
                            )}
                            <div ref={messagesEndRef} />
                        </div>

                        <form onSubmit={sendMessage} className="input-form">
                            <input
                                ref={inputRef}
                                type="text"
                                value={input}
                                onChange={(e) => setInput(e.target.value)}
                                placeholder="Type your message..."
                                disabled={loading}
                                className="message-input"
                            />
                            <button type="submit" disabled={loading} className="send-button">
                                {loading ? 'Sending...' : 'Send'}
                            </button>
                        </form>
                    </div>
                </main>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<ChatApp />);
    </script>
</body>
</html>
