<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hailo Chat</title>
    <link rel="stylesheet" href="styles.css">
    <script src="dist/react.production.min.js"></script>
    <script src="dist/react-dom.production.min.js"></script>
    <script src="dist/babel.min.js"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect } = React;

        function ChatApp() {
            const [messages, setMessages] = useState([]);
            const [input, setInput] = useState('');
            const [loading, setLoading] = useState(false);
            const [hailoStatus, setHailoStatus] = useState('checking');
            const [model, setModel] = useState('');

            const messagesEndRef = useRef(null);
            const inputRef = useRef(null);

            const STORAGE_KEY = 'robot_chat_history';
            const CONTEXT_LENGTH = 8;

            useEffect(() => {
                try {
                    const stored = localStorage.getItem(STORAGE_KEY);
                    if (stored) {
                        setMessages(JSON.parse(stored));
                    }
                } catch (error) {
                    console.error('Failed to load chat history:', error);
                }
            }, []);

            useEffect(() => {
                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(messages));
                } catch (error) {
                    console.error('Failed to save chat history:', error);
                }
            }, [messages]);

            const getHailoStatusLabel = () => {
                switch (hailoStatus) {
                    case 'online':
                        return 'Hailo online';
                    case 'offline':
                        return 'Hailo offline';
                    default:
                        return 'Checking Hailo...';
                }
            };

            const fetchHailoStatus = async () => {
                try {
                    const response = await fetch('/api/version', {
                        method: 'GET',
                        cache: 'no-store',
                    });

                    setHailoStatus(response.ok ? 'online' : 'offline');
                } catch (error) {
                    setHailoStatus('offline');
                }
            };

            const fetchModel = async () => {
                try {
                    const response = await fetch('/api/tags', {
                        cache: 'no-store',
                    });

                    if (!response.ok) {
                        return;
                    }

                    const data = await response.json();
                    const models = Array.isArray(data.models) ? data.models : [];

                    if (models.length > 0 && models[0].name) {
                        setModel(models[0].name);
                    }
                } catch (error) {
                    console.error('Failed to fetch model:', error);
                }
            };

            useEffect(() => {
                fetchHailoStatus();
                fetchModel();

                const interval = setInterval(() => {
                    fetchHailoStatus();
                }, 8000);

                return () => clearInterval(interval);
            }, []);

            const scrollToBottom = () => {
                messagesEndRef.current?.scrollIntoView({
                    behavior: 'smooth',
                });
            };

            useEffect(() => {
                scrollToBottom();
            }, [messages]);

            useEffect(() => {
                if (!loading) {
                    inputRef.current?.focus();
                }
            }, [loading, messages]);

            const getContextMessages = () => {
                const nonErrorMessages = messages.filter(
                    m => m.role !== 'error'
                );

                return nonErrorMessages.slice(-CONTEXT_LENGTH);
            };

            const getSafeContent = (content) => {
                if (typeof content !== 'string') {
                    return '';
                }

                const stripped = content.trim();

                if (
                    /^(?:<think|<thinking|thinking\s*:)/i.test(stripped) ||
                    /<think\b|<thinking\b|thinking\s*:/i.test(stripped)
                ) {
                    return '';
                }

                return content;
            };

            const sendMessage = async (e) => {
                e.preventDefault();

                if (!input.trim() || loading) {
                    return;
                }

                const userMessage = input.trim();
                setInput('');
                setLoading(true);

                setMessages(prev => [
                    ...prev,
                    {
                        role: 'user',
                        content: userMessage,
                    },
                    {
                        role: 'assistant',
                        content: '',
                        streaming: true,
                    },
                ]);

                try {
                    const contextMessages = getContextMessages();

                    const response = await fetch('/api/chat', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            model: model,
                            messages: [
                                ...contextMessages,
                                {
                                    role: 'user',
                                    content: userMessage,
                                },
                            ],
                            stream: true,
                            think: false,
                            options: {
                                temperature: 0.7,
                                num_predict: 64,
                            },
                        }),
                    });

                    if (!response.ok) {
                        throw new Error(
                            `Hailo error: ${response.status} ${response.statusText}`
                        );
                    }

                    if (!response.body) {
                        throw new Error(
                            'Streaming is not supported by this browser.'
                        );
                    }

                    const reader = response.body.getReader();
                    const decoder = new TextDecoder();

                    let buffer = '';
                    let assistantContent = '';

                    let metrics = {
                        timeMs: 0,
                        tokens: 0,
                        tokensPerSecond: 0,
                    };

                    const updateAssistant = (extra = {}) => {
                        setMessages(prev => {
                            const updated = [...prev];

                            for (let i = updated.length - 1; i >= 0; i--) {
                                if (updated[i].role === 'assistant') {
                                    updated[i] = {
                                        ...updated[i],
                                        ...extra,
                                    };
                                    break;
                                }
                            }

                            return updated;
                        });
                    };

                    while (true) {
                        const { value, done } = await reader.read();

                        if (done) {
                            break;
                        }

                        buffer += decoder.decode(value, {
                            stream: true,
                        });

                        const lines = buffer.split('\n');
                        buffer = lines.pop() || '';

                        for (const line of lines) {
                            const trimmed = line.trim();

                            if (!trimmed) {
                                continue;
                            }

                            let payload;

                            try {
                                payload = JSON.parse(trimmed);
                            } catch (error) {
                                console.warn(
                                    'Invalid streaming JSON:',
                                    trimmed
                                );
                                continue;
                            }

                            const chunk =
                                typeof payload?.message?.content === 'string'
                                    ? payload.message.content
                                    : typeof payload?.response === 'string'
                                        ? payload.response
                                        : '';

                            if (chunk) {
                                assistantContent += chunk;

                                const safeContent =
                                    getSafeContent(assistantContent);

                                updateAssistant({
                                    content: safeContent,
                                    streaming: true,
                                });
                            }

                            // Final response contains statistics.
                            if (payload.done) {
                                const totalDurationMs =
                                    Number(payload.total_duration || 0) /
                                    1_000_000;

                                const evalCount =
                                    Number(payload.eval_count || 0);

                                const evalDurationSeconds =
                                    Number(payload.eval_duration || 0) /
                                    1_000_000_000;

                                const tokensPerSecond =
                                    evalDurationSeconds > 0
                                        ? evalCount /
                                          evalDurationSeconds
                                        : 0;

                                metrics = {
                                    timeMs: totalDurationMs,
                                    tokens: evalCount,
                                    tokensPerSecond: tokensPerSecond,
                                };

                                updateAssistant({
                                    content: getSafeContent(
                                        assistantContent
                                    ),
                                    streaming: false,
                                    metrics: metrics,
                                });
                            }
                        }
                    }

                    setMessages(prev => {
                        const updated = [...prev];

                        for (let i = updated.length - 1; i >= 0; i--) {
                            if (updated[i].role === 'assistant') {
                                updated[i] = {
                                    ...updated[i],
                                    streaming: false,
                                };
                                break;
                            }
                        }

                        return updated;
                    });

                } catch (error) {
                    console.error(error);

                    setMessages(prev => {
                        const updated = [...prev];

                        // Remove empty streaming assistant message.
                        for (let i = updated.length - 1; i >= 0; i--) {
                            if (
                                updated[i].role === 'assistant' &&
                                updated[i].streaming
                            ) {
                                updated.splice(i, 1);
                                break;
                            }
                        }

                        updated.push({
                            role: 'error',
                            content: `Error: ${error.message}`,
                        });

                        return updated;
                    });
                } finally {
                    setLoading(false);
                }
            };

            const clearHistory = () => {
                if (window.confirm('Clear chat history?')) {
                    setMessages([]);
                }
            };

            return (
                <main className="container">
                    <header className="header">
                        <h1>
                            {model || 'Hailo'}...
                            <span
                                className={`status-pill ${hailoStatus}`}
                            >
                                <span className="status-dot" />
                                {getHailoStatusLabel()}
                            </span>
                        </h1>

                        <button
                            onClick={clearHistory}
                            className="clear-button"
                        >
                            Clear History
                        </button>
                    </header>

                    <div className="chat-container">
                        <div className="messages">
                            {!messages.length && !loading && (
                                <div className="intro">
                                    What’s on the agenda today?
                                </div>
                            )}

                            {messages.map((msg, idx) => (
                                <div
                                    key={idx}
                                    className={`message ${msg.role}`}
                                >
                                    <div className="message-role">
                                        {msg.role === 'user'
                                            ? 'You'
                                            : msg.role === 'assistant'
                                                ? 'Assistant'
                                                : 'Error'}
                                    </div>

                                    <div className="message-content">
                                        {msg.content}

                                        {msg.role === 'assistant' &&
                                            msg.metrics && (
                                                <div className="message-metrics">
                                                    {`Time: ${(msg.metrics.timeMs / 1000).toFixed(2)}s | Tokens: ${msg.metrics.tokens} | ${msg.metrics.tokensPerSecond.toFixed(1)} tok/s`}
                                                </div>
                                            )}
                                    </div>
                                </div>
                            ))}

                            {loading &&
                                messages.length > 0 &&
                                messages[messages.length - 1].streaming && (
                                    <div ref={messagesEndRef} />
                                )}

                            <div ref={messagesEndRef} />
                        </div>

                        <form
                            onSubmit={sendMessage}
                            className="input-form"
                        >
                            <input
                                ref={inputRef}
                                type="text"
                                value={input}
                                onChange={e =>
                                    setInput(e.target.value)
                                }
                                placeholder="Type your message..."
                                disabled={loading || !model}
                                className="message-input"
                            />

                            <button
                                type="submit"
                                disabled={loading || !model}
                                className="send-button"
                            >
                                {loading ? 'Sending...' : 'Send'}
                            </button>
                        </form>
                    </div>
                </main>
            );
        }

        ReactDOM.createRoot(
            document.getElementById('root')
        ).render(<ChatApp />);
    </script>
</body>
</html>
